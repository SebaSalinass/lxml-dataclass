[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lxml-dataclass"
version = "1.0.6"
description = "Create LXML Elements as dataclasses representations"
readme = "README.md"
authors = [{ name = "Sebastian Salinas", email = "seba.salinas.delrio@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
keywords = ["lxml", "dataclass", "xml"]

requires-python = ">=3.11"
dependencies = [
    "lxml>=5.4.0",
]

[project.urls]
Homepage = "https://github.com/sebasalinass/lxml-dataclass"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
]

[tool.uv]
no-binary-package = ["lxml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
disable_error_code = "annotation-unchecked"